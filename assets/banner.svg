<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="50%" stop-color="#0f2340"/>
      <stop offset="100%" stop-color="#1c4b6e"/>
      <animate attributeName="x1" values="0;1200;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <circle cx="150" cy="70" r="58" fill="#22c55e" fill-opacity="0.12">
    <animate attributeName="r" values="48;68;48" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.08;0.18;0.08" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="250" r="78" fill="#8b5cf6" fill-opacity="0.14">
    <animate attributeName="r" values="68;92;68" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.10;0.20;0.10" dur="9s" repeatCount="indefinite"/>
  </circle>

  <path d="M120 248C230 186 320 176 450 205C580 234 663 230 785 178C897 130 994 126 1100 162" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 14" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;280" dur="8s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#glow)">
    <text x="72" y="132" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">DSA Journey</text>
    <text x="72" y="182" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="500">Clean progress logs, platform splits, and tracked practice</text>
    <text x="72" y="232" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">LeatCode + NeetCode solutions under one evolving roadmap</text>
  </g>

  <g transform="translate(915 64)">
    <rect x="0" y="0" width="210" height="192" rx="22" fill="#0b1220" fill-opacity="0.64" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="24" y="46" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Focus</text>
    <text x="24" y="78" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Arrays</text>
    <text x="24" y="106" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Strings</text>
    <text x="24" y="134" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Trees</text>
    <text x="24" y="162" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Dynamic Programming</text>
    <circle cx="162" cy="72" r="8" fill="#22c55e">
      <animate attributeName="r" values="6;10;6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="100" r="8" fill="#38bdf8">
      <animate attributeName="r" values="6;10;6" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="128" r="8" fill="#f59e0b">
      <animate attributeName="r" values="6;10;6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="156" r="8" fill="#a78bfa">
      <animate attributeName="r" values="6;10;6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
